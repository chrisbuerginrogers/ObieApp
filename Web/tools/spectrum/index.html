<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../../coi-serviceworker.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spectrum Monitor — ObieWebApp</title>

  <link rel="stylesheet" href="../../css/theme.css">
  <script src="../../version.js"></script>
  <script>document.write('<link rel="stylesheet" href="./spectrum.css?v='+OBIE_VERSION+'">');</script>

  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" crossorigin="anonymous"></script>

  <!-- PyScript — version set by home-page toggle -->
  <script>(function(){var v=localStorage.getItem('obiePyScriptVersion')||'2026.3.1';document.write('<link rel="stylesheet" href="https://pyscript.net/releases/'+v+'/core.css">');document.write('<scr'+'ipt type="module" src="https://pyscript.net/releases/'+v+'/core.js"><\/scr'+'ipt>');})();</script>

  <!-- Shared JS — order matters -->
  <script src="../../js/plotly-theme.js"></script>
  <script src="../../js/obie-settings.js"></script>
  <script src="../../js/browser-check.js"></script>
  <script>document.write('<scr'+'ipt src="./spectrum.js?v='+OBIE_VERSION+'" defer><\/scr'+'ipt>');</script>
</head>
<body>

<div id="loading" class="loading-overlay">
  <div class="spin"></div>
  <div class="load-title">Loading PyScript + NumPy…</div>
  <div class="load-sub">First load may take 15–30 s</div>
</div>
<script>
  setTimeout(function() {
    var el = document.getElementById('loading');
    if (!el || el.classList.contains('gone')) return;
    el.querySelector('.spin').style.display = 'none';
    el.querySelector('.load-title').textContent = 'Failed to load';
    el.querySelector('.load-sub').textContent =
      'PyScript could not be fetched. This app requires Chrome or Edge.';
  }, 90000);
</script>

<div class="sm-page">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="obie-header">
    <a class="brand" href="../../index.html">
      <div class="logo-icon">🎻</div>
      <h1>ObieWebApp</h1>
    </a>
    <span class="crumb">· Spectrum Monitor</span>
    <div class="gap"></div>
    <a class="btn" href="../../index.html" style="font-size:0.75rem;padding:3px 9px">← All tools</a>
  </header>

  <!-- ── Toolbar ────────────────────────────────────────────────────────── -->
  <div class="sm-toolbar">
    <button id="sm-folder-btn" class="tb-btn" onclick="smSetDataFolder()">📁 Data Folder</button>
    <span id="sm-folder-name" class="folder-name-disp"></span>
    <div class="tb-flex"></div>
    <div class="mode-row">
      <button class="mode-btn active" id="sm-view-scope" onclick="smSetView('scope')">Waveform + Spectrum</button>
      <button class="mode-btn"        id="sm-view-spec"  onclick="smSetView('spectrogram')">Spectrogram</button>
    </div>
    <div class="tb-flex"></div>
    <button class="tb-btn" onclick="smHelp()">Help</button>
    <button id="sm-pause-btn" class="tb-btn" onclick="smTogglePause()" disabled>⏸ Pause</button>
    <button id="sm-start-btn" class="tb-btn accent" onclick="smToggleCapture()">▶ Start</button>
  </div>

  <!-- ── Status row ─────────────────────────────────────────────────────── -->
  <div class="sm-status-row">
    <span id="sm-status" class="sm-status-txt">Press Start to begin</span>
    <div class="tb-flex"></div>
    <span id="soundcard-ind" onclick="smOpenDevicePicker()"
          style="font-size:10px;color:#1565c0;font-weight:600;white-space:nowrap;cursor:pointer"
          title="Click to change input device"></span>
  </div>

  <!-- ── Body: settings sidebar + resizer + plot area ──────────────────── -->
  <div class="sm-body">

    <!-- Left settings panel -->
    <div class="sm-left">
      <div>
        <div class="sm-sect">Channel</div>
        <div class="mode-row">
          <button class="mode-btn active" id="sm-ch-1" onclick="smSetChannel(1)">Ch 1</button>
          <button class="mode-btn"        id="sm-ch-2" onclick="smSetChannel(2)">Ch 2</button>
        </div>
      </div>
      <div>
        <div class="sm-sect">Averaging</div>
        <div class="sm-row">
          <label>Averages (N)</label>
          <input id="sm-inp-navg" type="number" value="5" min="1" max="50" onchange="smSettingsChanged()">
        </div>
        <div class="sm-row">
          <label>Snippet</label>
          <input id="sm-inp-snip" type="number" value="0.3" step="0.05" min="0.05" max="2" onchange="smSettingsChanged()">
          <span class="sm-unit">s</span>
        </div>
      </div>
      <div>
        <div id="sm-level" class="sm-stat">–</div>
        <div style="font-size:9px;color:var(--muted);text-align:center">Peak level</div>
      </div>
    </div>

    <!-- Drag resize handle -->
    <div id="sm-resizer" class="sm-resizer"></div>

    <!-- Right: plot area (scope view + spectrogram view, one visible at a time) -->
    <div class="sm-right">

      <div id="sm-scope-view" class="sm-view">
        <div class="sm-chart-wrap" style="flex:1">
          <div class="sm-chart-title">Waveform</div>
          <div id="sm-wave-plot" class="sm-plot-div"></div>
        </div>
        <div class="sm-chart-wrap" style="flex:1.4">
          <div class="sm-chart-title" id="sm-spec-title">Spectrum (averaged)</div>
          <div id="sm-spectrum-plot" class="sm-plot-div"></div>
        </div>
      </div>

      <div id="sm-spectrogram-view" class="sm-view" style="display:none">
        <div class="sm-chart-wrap" style="flex:1">
          <div class="sm-chart-title">Spectrogram (trailing window)</div>
          <div id="sm-spectrogram-plot" class="sm-plot-div"></div>
        </div>
      </div>

    </div>

  </div>

</div><!-- .sm-page -->

<!-- ── Quick Device Picker (mirrors Acquire's) ─────────────────────────── -->
<div id="device-picker-modal" class="modal-overlay">
  <div class="modal-box" style="width:min(92vw,360px)">
    <div class="modal-header">
      <span class="modal-title">Input Device</span>
      <button class="modal-close" onclick="smCloseDevicePicker()" title="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="io-row">
        <label for="device-picker-select" title="Audio input device to record from">Device</label>
        <button class="io-recheck-btn" onclick="smRecheckDevices()" title="Recheck devices">⟳</button>
        <select id="device-picker-select" onchange="smApplyDeviceSelection()"
                title="Select the audio input device — takes effect immediately"></select>
      </div>
      <p class="pref-hint" style="margin-left:0">Takes effect immediately.</p>
    </div>
  </div>
</div>

<script type="py" src="./main.py" config="./pyscript.toml" async></script>
</body>
</html>
