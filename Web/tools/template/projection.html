<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Node Projection — ObieWebApp</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100%; height: 100%; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="proj-canvas"></canvas>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('proj-canvas');
  const ctx    = canvas.getContext('2d');

  let _nodes        = [];
  let _transform    = { scale: 5, xStretch: 1, yStretch: 1, rotation: 0, panX: 0, panY: 0 };
  let _nodeRadius   = 10;
  let _currentNode  = null;
  let _doneNodes    = new Set();
  let _violinViz    = { show: false, orientation: 'horizontal', opacity: 0.25 };
  let _verticalMount = false;

  const _violinImg = new Image();
  _violinImg.src    = './violin-outline.svg';
  _violinImg.onload = () => render();

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    render();
  }
  window.addEventListener('resize', resize);
  resize();

  function physToScreen(xMm, yMm) {
    const { scale, xStretch, yStretch, rotation, panX, panY } = _transform;
    const W = canvas.width, H = canvas.height;
    const rad = rotation * Math.PI / 180;
    const px  = xMm * scale * xStretch;
    const py  = yMm * scale * yStretch;
    return {
      x: W / 2 + panX + px * Math.cos(rad) - py * Math.sin(rad),
      y: H / 2 + panY + px * Math.sin(rad) + py * Math.cos(rad)
    };
  }

  function drawViolinOutline(W, H) {
    if (!_violinViz.show || !_violinImg.complete || !_violinImg.naturalWidth) return;
    const { scale, xStretch, yStretch, rotation, panX, panY } = _transform;
    const rad = rotation * Math.PI / 180;
    ctx.save();
    ctx.globalAlpha = _violinViz.opacity;
    ctx.translate(W / 2 + panX, H / 2 + panY);
    ctx.rotate(rad);
    ctx.scale(scale * xStretch, scale * yStretch);
    if (_violinViz.orientation === 'vertical') ctx.rotate(Math.PI / 2);
    ctx.rotate(Math.PI);
    ctx.drawImage(_violinImg, -200, -131.5, 400, 248);
    ctx.restore();
  }

  function render() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Apply vertical mount rotation (-90°) around canvas centre so the
    // projector (physically rotated +90°) shows correct orientation on the violin.
    ctx.save();
    if (_verticalMount) {
      ctx.translate(W / 2, H / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.translate(-W / 2, -H / 2);
    }

    drawViolinOutline(W, H);

    if (!_nodes.length) { ctx.restore(); return; }

    // Draw edges between row/col neighbors
    ctx.strokeStyle = 'rgba(0, 220, 100, 0.3)';
    ctx.lineWidth = 1.5;
    _nodes.forEach(n => {
      const pos  = physToScreen(n.xMm, n.yMm);
      const right = _nodes.find(m => m.row === n.row && m.col === n.col + 1);
      if (right) {
        const rp = physToScreen(right.xMm, right.yMm);
        ctx.beginPath(); ctx.moveTo(pos.x, pos.y); ctx.lineTo(rp.x, rp.y); ctx.stroke();
      }
      const below = _nodes.find(m => m.row === n.row + 1 && m.col === n.col);
      if (below) {
        const bp = physToScreen(below.xMm, below.yMm);
        ctx.beginPath(); ctx.moveTo(pos.x, pos.y); ctx.lineTo(bp.x, bp.y); ctx.stroke();
      }
    });

    // Draw nodes
    const r = _nodeRadius;
    const watching = _currentNode !== null || _doneNodes.size > 0;

    _nodes.forEach(n => {
      const pos    = physToScreen(n.xMm, n.yMm);
      const isCur  = n.id === _currentNode;
      const isDone = _doneNodes.has(n.id);

      if (isCur) {
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, r * 2.4, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 220, 0, 0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, r * 1.6, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 220, 0, 0.8)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      const nodeR = isCur ? r * 1.3 : r;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, nodeR, 0, Math.PI * 2);

      if (isCur)         ctx.fillStyle = '#ffee00';
      else if (isDone)   ctx.fillStyle = 'rgba(90,110,85,0.45)';
      else if (watching) ctx.fillStyle = 'rgba(0,200,90,0.55)';
      else               ctx.fillStyle = '#00ff66';

      ctx.fill();

      // Labels: when vertical mount is on the text is already rotated -90° by
      // the canvas transform, which is correct — the projector's +90° physical
      // rotation will make them appear upright on the violin surface.
      ctx.fillStyle = isCur ? '#000' : (isDone ? 'rgba(200,220,190,0.5)' : '#000');
      ctx.font = `bold ${Math.max(8, Math.round(nodeR * 1.1))}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label, pos.x, pos.y);
    });

    ctx.restore();
  }

  window.addEventListener('message', e => {
    if (!e.data || e.data.type !== 'tpl-update') return;
    if (e.data.nodes)                _nodes         = e.data.nodes;
    if (e.data.transform)            _transform     = e.data.transform;
    if (e.data.nodeRadius != null)   _nodeRadius    = e.data.nodeRadius;
    if ('currentNode' in e.data)     _currentNode   = e.data.currentNode;
    if (e.data.doneNodes)            _doneNodes     = new Set(e.data.doneNodes);
    if (e.data.violinViz)            _violinViz     = e.data.violinViz;
    if ('verticalMount' in e.data)   _verticalMount = e.data.verticalMount;
    render();
  });
})();
</script>
</body>
</html>
