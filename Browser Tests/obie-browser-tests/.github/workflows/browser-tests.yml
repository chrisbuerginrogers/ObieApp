name: browser-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          # App requires Chromium-family browser (File System Access / audio APIs)
          playwright install --with-deps chromium

      - name: Run Tier-A browser tests against the live site
        run: pytest --browser chromium
        env:
          OBIE_BASE_URL: https://chrisbuerginrogers.github.io/ObieApp/Web
